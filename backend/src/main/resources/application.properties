spring.application.name=backend

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${CAMPUSHUB_DB_URL:jdbc:mysql://localhost:3306/CampusHub}
spring.datasource.username=${CAMPUSHUB_DB_USERNAME:root}
spring.datasource.password=${CAMPUSHUB_DB_PASSWORD}

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.properties.hibernate.default_catalog=${CAMPUSHUB_DB_NAME:CampusHub}

spring.jpa.properties.hibernate.hbm2ddl.jdbc_metadata_extraction_strategy=individually

# =========================================================
# SQL INITIALIZATION
# =========================================================

spring.sql.init.mode=never

# =========================================================
# SESSION COOKIE
# =========================================================
#
# Local development:
#   SameSite=Lax
#   Secure=false
#
# Production:
#   Render environment variables will override these values:
#   CAMPUSHUB_SESSION_COOKIE_SAMESITE=None
#   CAMPUSHUB_SESSION_COOKIE_SECURE=true
#
# This is required because the production frontend runs on
# Vercel while the backend runs on Render.
# =========================================================

server.servlet.session.cookie.same-site=${CAMPUSHUB_SESSION_COOKIE_SAMESITE:Lax}

server.servlet.session.cookie.secure=${CAMPUSHUB_SESSION_COOKIE_SECURE:false}

# =========================================================
# CAMPUSHUB SMS / OTP
# =========================================================

campushub.sms.provider=console

# =========================================================
# PUBLIC DEMO MODE
# =========================================================

campushub.demo.enabled=true

# Fixed OTP intentionally used by the public demo accounts.
# This value is NOT a secret.
campushub.demo.otp=123456

# =========================================================
# PUBLIC DEMO ADMIN
# =========================================================

campushub.demo.admin.id=ADMIN_zmdVHK342$
campushub.demo.admin.phone=7899877890

# =========================================================
# SPECIAL ADMIN
# =========================================================
#
# IMPORTANT:
# Do NOT put the real Special Admin ID or phone number here.
# They are supplied through environment variables.
#
# Local:
#   CAMPUSHUB_DEMO_SPECIAL_ADMIN_ID
#   CAMPUSHUB_DEMO_SPECIAL_ADMIN_PHONE
#
# Render:
#   Set the same environment variables in the Render service.
# =========================================================

campushub.demo.special-admin.id=${CAMPUSHUB_DEMO_SPECIAL_ADMIN_ID:}
campushub.demo.special-admin.phone=${CAMPUSHUB_DEMO_SPECIAL_ADMIN_PHONE:}

