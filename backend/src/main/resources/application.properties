spring.application.name=backend

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${CAMPUSHUB_DB_URL:jdbc:mysql://localhost:3306/CampusHub}
spring.datasource.username=${CAMPUSHUB_DB_USERNAME:root}
spring.datasource.password=${CAMPUSHUB_DB_PASSWORD}

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.properties.hibernate.default_catalog=${CAMPUSHUB_DB_NAME:CampusHub}

spring.jpa.properties.hibernate.hbm2ddl.jdbc_metadata_extraction_strategy=individually

# =========================================================
# SQL INITIALIZATION
# =========================================================
#
# The CampusHub database already exists.
# Do not execute schema.sql automatically on startup.
#
# We will initialize the production Railway database
# separately later.
# =========================================================

spring.sql.init.mode=never

# =========================================================
# SESSION COOKIE
# =========================================================

server.servlet.session.cookie.same-site=Lax

# =========================================================
# CAMPUSHUB SMS / OTP
# =========================================================

campushub.sms.provider=console

# =========================================================
# PUBLIC DEMO MODE
# =========================================================

campushub.demo.enabled=true

campushub.demo.otp=123456

